{% extends "base.html" %}
{% block title %}Circuit Hub - Login{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-box">
        <div class="auth-brand">⚡ Circuit Hub</div>
        <p class="tagline">Your IT Essentials, One Click Away.</p>
        <h1>Welcome back!</h1>
        <p class="auth-intro">Log in as an IT student or teacher/instructor to continue.</p>

        <form action="{{ url_for('login') }}" method="POST">
            <label for="email">Email</label>
            <input
                id="email"
                type="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <div style="position: relative; width: 100%; margin-bottom: 15px;">
                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                    style="width: 100%; box-sizing: border-box; padding-right: 48px;"
                >
                <button
                    type="button"
                    class="toggle-password"
                    data-target="password"
                    aria-label="Show password"
                    title="Show password"
                    style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: transparent; cursor: pointer; font-size: 20px; padding: 5px;"
                >👁️</button>
            </div>

            <label for="account_type">Account Type</label>
            <select id="account_type" name="account_type" required>
                <option value="">Select account type</option>
                <option value="student">IT Student</option>
                <option value="teacher">Teacher / Instructor</option>
                <option value="admin">Administrator</option>
            </select>

            <button type="submit" class="auth-btn">Login</button>
        </form>

        <p class="register-text">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register here</a>
        </p>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".toggle-password").forEach(function (button) {
        button.addEventListener("click", function () {
            const input = document.getElementById(this.dataset.target);
            const show = input.type === "password";

            input.type = show ? "text" : "password";
            this.textContent = show ? "🙈" : "👁️";
            this.setAttribute(
                "aria-label",
                show ? "Hide password" : "Show password"
            );
            this.setAttribute(
                "title",
                show ? "Hide password" : "Show password"
            );
        });
    });
});
</script>
{% endblock %}
