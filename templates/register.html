{% extends "base.html" %}
{% block title %}Circuit Hub - Register{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-box">
        <div class="auth-brand">⚡ Circuit Hub</div>
        <p class="tagline">Your IT Essentials, One Click Away.</p>
        <h1>Create your account</h1>
        <p class="auth-intro">Register as an IT student or teacher/instructor.</p>

        <form action="{{ url_for('register') }}" method="POST">
            <label for="name">Full Name</label>
            <input id="name" type="text" name="name" placeholder="Enter your full name" required>

            <label for="email">Email</label>
            <input id="email" type="email" name="email" placeholder="Enter your email" required>

            <label for="account_type">Account Type</label>
            <select id="account_type" name="account_type" required>
                <option value="">Select account type</option>
                <option value="student">IT Student</option>
                <option value="teacher">Teacher / Instructor</option>
            </select>

            <label for="school">School / Institution</label>
            <input id="school" type="text" name="school" placeholder="Enter school or institution" required>

            <label for="contact">Contact Number <span class="optional">(optional)</span></label>
            <input id="contact" type="text" name="contact" placeholder="09XXXXXXXXX">

            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="At least 6 characters" minlength="6" required>

            <label for="confirm_password">Confirm Password</label>
            <input id="confirm_password" type="password" name="confirm_password" placeholder="Re-enter your password" minlength="6" required>

            <button type="submit" class="auth-btn">Create Account</button>
        </form>

        <p class="register-text">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
</div>
{% endblock %}
